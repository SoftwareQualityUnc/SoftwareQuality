sonar.projectKey=softwarequality-tp3
sonar.projectName=MVC Ecommerce - TP3
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/tests
sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test
sonar.java.source=17
sonar.java.libraries=backend/build/sonar-libs/*.jar
sonar.java.test.libraries=backend/build/sonar-libs/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.junit.reportPaths=backend/build/test-results/test
sonar.exclusions=**/*.png,**/*.jpg,**/*.svg,**/*.ico
sonar.scm.disabled=true

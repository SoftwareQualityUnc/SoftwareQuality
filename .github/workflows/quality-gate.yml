name: Quality Gate

on:
  push:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  checkstyle:
    name: Backend Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: backend

      - name: Run Checkstyle
        id: checkstyle
        run: ./gradlew checkstyleMain --no-daemon
        working-directory: backend

      - name: Add Checkstyle summary
        if: always()
        shell: bash
        run: |
          report="backend/build/reports/checkstyle/main.xml"
          {
            echo "## Backend Checkstyle"
            echo "- Result: \`${{ steps.checkstyle.outcome }}\`"
            if [ -f "$report" ]; then
              errors=$(grep -o '<error ' "$report" | wc -l || true)
              files=$(grep -o '<file ' "$report" | wc -l || true)
              echo "- Files with violations: \`$files\`"
              echo "- Violations: \`$errors\`"
              echo "- Detailed HTML and XML reports are available in the \`checkstyle-reports\` artifact."
            else
              echo "- The Checkstyle XML report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: |
            backend/build/reports/checkstyle/main.html
            backend/build/reports/checkstyle/main.xml
          if-no-files-found: warn

  frontend-eslint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        id: eslint
        run: npm run lint -- --format json --output-file eslint-report.json
        working-directory: frontend

      - name: Add ESLint summary
        if: always()
        shell: bash
        run: |
          report="frontend/eslint-report.json"
          {
            echo "## Frontend ESLint"
            echo "- Result: \`${{ steps.eslint.outcome }}\`"
            if [ -f "$report" ]; then
              node - "$report" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const files = report.filter((entry) => entry.errorCount + entry.warningCount > 0).length;
          const errors = report.reduce((total, entry) => total + entry.errorCount, 0);
          const warnings = report.reduce((total, entry) => total + entry.warningCount, 0);
          console.log(`- Files with findings: \`${files}\``);
          console.log(`- Errors: \`${errors}\``);
          console.log(`- Warnings: \`${warnings}\``);
          console.log('- Detailed JSON report is available in the `eslint-reports` artifact.');
          NODE
            else
              echo "- The ESLint JSON report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-reports
          path: frontend/eslint-report.json
          if-no-files-found: warn
